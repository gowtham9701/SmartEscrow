services:
  - type: web
    name: smartescrow-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend && gunicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: APP_NAME
        value: SmartEscrow
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_CURRENCY
        value: INR
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_TOKEN
        sync: false
      - key: OLLAMA_HOST
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: deepseek-coder:6.7b
