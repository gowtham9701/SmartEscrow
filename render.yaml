services:
  - type: web
    name: smartescrow-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: APP_NAME
        value: SmartEscrow
      - key: API_V1_PREFIX
        value: /api/v1
      # --- Database: paste your Neon connection string (use the +asyncpg form) ---
      # postgresql+asyncpg://USER:PASSWORD@ep-xxx-pooler.REGION.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: DATABASE_URL
        sync: false
      # --- Auth ---
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # --- Email / OTP (real verification emails via Resend, free) ---
      - key: OTP_DELIVERY
        value: auto
      - key: OTP_TTL_MINUTES
        value: "15"
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        value: SmartEscrow <onboarding@resend.dev>
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      # --- Payments (MVP uses a simulated USD gateway) ---
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PAYMENT_CURRENCY
        value: USD
      # --- GitHub (AI verification + webhook merge triggers) ---
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_TOKEN
        sync: false
      # --- Local Ollama (not used in cloud; harmless defaults) ---
      - key: OLLAMA_HOST
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: deepseek-coder:6.7b
